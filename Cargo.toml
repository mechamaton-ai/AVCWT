[package]
name = "avcwt"
version = "0.2.0"
edition = "2021"
description = "Synchronized media playback desktop application powered by Rust, egui, and libmpv"
license = "MIT"

[lib]
name = "avcwt"
path = "src/lib.rs"

[[bin]]
name = "avcwt"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
log = "0.4"
env_logger = "0.11"
